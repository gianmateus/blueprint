# Dogfooding: Blueprint reviews its own pull requests.
name: blueprint review
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: ./
        with:
          fail-on-new-cracks: 'true'
